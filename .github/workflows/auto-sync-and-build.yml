name: Sync Upstream, Patch and Release

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even if no upstream changes"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  sync-and-build:
    name: Sync, Patch & Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/MorpheApp/morphe-patches.git || true
          git fetch upstream main

          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          LOCAL_HEAD=$(git rev-parse HEAD)
          echo "Upstream HEAD: $UPSTREAM_HEAD"
          echo "Local HEAD:    $LOCAL_HEAD"

          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $BEHIND_COUNT"

          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "New upstream commits found ($BEHIND_COUNT). Merging upstream/main..."
            if git merge upstream/main --no-edit -m "chore: sync upstream MorpheApp/morphe-patches"; then
              echo "Successfully merged upstream/main."
            else
              echo "Merge conflict detected. Resolving known custom files with upstream's version (the overlay step re-applies our customs)..."
              # Known fork-customized files: take upstream's version for these paths only.
              # The custom overlay (custom-overlays/) re-applies our versions right after.
              git checkout --theirs -- extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java extensions/shared-youtube/library/src/main/java/app/morphe/extension/shared/patches/GmsCoreSupportPatch.java || true
              git add extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java extensions/shared-youtube/library/src/main/java/app/morphe/extension/shared/patches/GmsCoreSupportPatch.java || true
              # Fork rule (same as the post-merge strip below): upstream's
              # CI-only workflows must never land in this fork. The fork
              # deleted them, so an upstream edit to one shows up here as
              # a modify/delete conflict — resolve it by keeping the
              # deletion. The fork's own two workflows are never
              # auto-resolved; a conflict on them still fails loudly.
              git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' conflicted; do
                case "$conflicted" in
                  .github/workflows/auto-sync-and-build.yml|.github/workflows/build_pull_request.yml) ;;
                  .github/workflows/*.yml)
                    echo "Keeping upstream workflow deleted (fork rule): $conflicted"
                    git rm -q -- "$conflicted" || true ;;
                esac
              done
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "ERROR: Unresolved conflicts in files other than the known custom files. Failing loudly instead of building stale code."
                git diff --name-only --diff-filter=U
                exit 1
              fi
              git -c core.editor=true merge --continue
              echo "Merge completed with known custom files resolved to upstream."
            fi
            # Fork rule: GITHUB_TOKEN can never create or update workflow files,
            # so upstream's CI-only workflows must never land in this fork.
            # Strip any .github/workflows/*.yml that is not one of the fork's own
            # workflows out of the merge commit before pushing (re-applied on
            # every sync, so future upstream workflows are excluded too).
            # Templates and scripts under .github/ still sync normally.
            for wf in .github/workflows/*.yml; do
              [ -e "$wf" ] || continue
              case "$wf" in
                .github/workflows/auto-sync-and-build.yml|.github/workflows/build_pull_request.yml) ;;
                *) echo "Excluding upstream workflow from sync: $wf"
                   git rm -q --cached "$wf" 2>/dev/null || true
                   rm -f "$wf" ;;
              esac
            done
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
              echo "Merge commit amended: upstream workflows excluded."
            fi
            git push origin main || { echo "ERROR: Failed to push merge to fork."; exit 1; }
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Fork is already completely up to date with upstream."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply Custom Overlay
        run: |
          python3 custom-overlays/apply_overlay.py

      - name: Ensure Fork MicroG Trust Markers
        run: |
          python3 scripts/ensure_gms_fork_markers.py
          if [[ -n $(git status --porcelain -- extensions/shared-youtube/library/src/main/java/app/morphe/extension/shared/patches/GmsCoreSupportPatch.java) ]]; then
            git add extensions/shared-youtube/library/src/main/java/app/morphe/extension/shared/patches/GmsCoreSupportPatch.java
            git commit -m "chore: restore fork MicroG trust markers after upstream sync" || true
            git push origin main || true
          fi

      - name: Apply Custom Premium & Swipe Defaults
        run: |
          python3 scripts/apply_custom_defaults.py
          if [[ -n $(git status --porcelain) ]]; then
            git add extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
            git commit -m "chore: ensure custom YouTube Premium header and Swipe controls defaults" || true
            git push origin main || true
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Patches (.mpp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x ./gradlew
          # 4 GB daemon heap: v2.0.0 build OOMs at the 2 GB gradle.properties default
          ./gradlew build -x test -x lint -x lintVitalRelease --stacktrace -Dorg.gradle.jvmargs="-Xms512M -Xmx4g"

      - name: Publish Custom Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          MPP_FILE=$(find patches/build/libs build/libs -name "*.mpp" ! -name "*-sources.mpp" 2>/dev/null | head -n 1)

          if [ -z "$MPP_FILE" ]; then
            echo "❌ No binary .mpp file generated!"
            exit 1
          fi

          echo "✅ Generated custom binary: $MPP_FILE"

          ALL_MPP=$(find patches/build/libs build/libs -name "*.mpp" 2>/dev/null | sort -u)

          # Replace latest release with new binary in this fork repo
          gh release delete latest --repo "$GH_REPO" --yes || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          gh release create latest $ALL_MPP \
            --repo "$GH_REPO" \
            --title "Custom Morphe Patches (Premium & Swipe Controls Defaults)" \
            --notes "Automated build of Morphe Patches with YouTube Premium Header Logo, Swipe Controls enabled, and complete MicroG RE compatibility." \
            --latest
